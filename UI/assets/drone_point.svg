<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 160" width="128" height="160" aria-label="Drone waypoint pin">
  <!-- Pin -->
  <path d="M64 4C39.1 4 19 24.1 19 49c0 34.2 35.5 77.6 42.1 85.5a4 4 0 0 0 5.8 0C73.5 126.6 109 83.2 109 49 109 24.1 88.9 4 64 4z"
        fill="#FF3B30"/>
  <!-- Inner circle -->
  <circle cx="64" cy="52" r="30" fill="#fff"/>

  <!-- Drone icon (simple) -->
  <g fill="#111" transform="translate(64 52)">
    <!-- body -->
    <rect x="-16" y="-6" width="32" height="12" rx="6"/>
    <!-- camera -->
    <rect x="-4" y="6" width="8" height="8" rx="2"/>
    <circle cx="0" cy="10" r="2" fill="#fff"/>
    <!-- arms -->
    <rect x="-34" y="-2" width="18" height="4" rx="2"/>
    <rect x="16" y="-2" width="18" height="4" rx="2"/>
    <!-- rotors -->
    <circle cx="-34" cy="0" r="7"/>
    <circle cx="34" cy="0" r="7"/>
    <circle cx="-34" cy="0" r="3" fill="#fff"/>
    <circle cx="34" cy="0" r="3" fill="#fff"/>
    <!-- small top detail -->
    <rect x="-6" y="-14" width="12" height="6" rx="3"/>
  </g>
</svg>
